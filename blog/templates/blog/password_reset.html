{% extends "blog/base.html" %}
{% block title %}Reset your password | Neo Niigata{% endblock %}
{% block content %}
<section class="form-page">
  <header class="page-heading form-heading">
    <p class="eyebrow">Account recovery</p>
    <h1>Reset your <span>password.</span></h1>
    <p class="page-heading__intro">Enter your account email and we'll send you a link to choose a new password.</p>
  </header>
  <form method="post" class="post-form">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button type="submit" class="button button--primary">Send reset link <span aria-hidden="true">↗</span></button>
    </div>
  </form>
</section>
{% endblock %}
