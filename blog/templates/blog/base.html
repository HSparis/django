{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DjangoBlog{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'blog/css/style.css' %}?v=2">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <nav class="navbar navbar-expand-lg site-nav">
    <div class="container site-nav__inner">
      <a class="navbar-brand" href="{% url 'home' %}"><span class="brand-mark">D</span><span>DjangoBlog</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar" aria-controls="main-navbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Articles</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
          <li class="nav-item nav-create"><a class="button button--nav" href="{% url 'post_create' %}"><span aria-hidden="true">＋</span> New post</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container page-shell" id="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container site-footer__inner"><span>DjangoBlog</span><span>A place for good ideas.</span></div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
