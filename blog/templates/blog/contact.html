{% extends "blog/base.html" %}

{% block title %}Contact | DjangoBlog{% endblock %}

{% block content %}
<section class="simple-page contact-page">
	<p class="eyebrow">Let's talk</p>
	<h1>Every good idea starts with <span>a conversation.</span></h1>
	<div class="simple-page__body">
		<p>Have a suggestion, a question, or a story to share? We would love to hear from you.</p>
		<a class="button button--primary" href="{% url 'post_create' %}">Write a post <span aria-hidden="true">→</span></a>
	</div>
</section>
{% endblock %}
