{% extends "blog/base.html" %}
{% block title %}Excluir artigo | Neo Niigata{% endblock %}
{% block content %}
<section class="confirm-page">
    <div class="confirm-mark" aria-hidden="true">!</div>
    <p class="eyebrow">Confirmar exclusão</p>
    <h1>Excluir este artigo?</h1>
    <p class="confirm-page__title">“{{ object.title }}”</p>
    <p class="confirm-page__note">Esta ação é permanente e não pode ser desfeita.</p>
    <form method="post" class="confirm-actions">
        {% csrf_token %}
        <button type="submit" class="button button--danger">Sim, excluir artigo</button>
        <a href="{% url 'post_detail' object.slug %}" class="button button--quiet">Manter artigo</a>
    </form>
</section>
{% endblock %}
