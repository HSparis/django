name: Neo Tokyo checks

on:
  push:
    branches: ["neo-tokyo/visual-etapa-1"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "Django>=5.2,<5.3" Pillow
      - name: Check Django integration
        run: python manage.py check --settings=config.test_settings
      - name: Run magazine and existing CRUD tests
        run: python manage.py test blog --settings=config.test_settings --verbosity=2
